name: build panel module

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      KERNEL_REPO: arduino/linux-qcom
      KERNEL_BRANCH: qcom-v7.0.0-unoq
      KERNEL_RELEASE: 7.0.0-g122c2c22d838

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev \
            flex bison bc cpio \
            ccache

      - name: Resolve kernel branch SHA
        id: kernel-sha
        run: |
          SHA=$(git ls-remote "https://github.com/${KERNEL_REPO}.git" "refs/heads/${KERNEL_BRANCH}" | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve ${KERNEL_BRANCH} on ${KERNEL_REPO}"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Kernel SHA: $SHA"

      - name: Restore kernel build cache
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            kbuild
            ~/.ccache
          key: kernel-${{ steps.kernel-sha.outputs.sha }}-${{ hashFiles('kernel/panel-sitronix-st7701.patch', 'kernel/configs/uno-q-7.0.0.config') }}

      - name: Clone kernel and apply patch (cache miss)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "${KERNEL_BRANCH}" --depth 200 \
            "https://github.com/${KERNEL_REPO}.git" kbuild
          cd kbuild
          git apply ../kernel/panel-sitronix-st7701.patch
          cp ../kernel/configs/uno-q-7.0.0.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Prepare module build headers
        run: |
          cd kbuild
          # Pin the kernel version string so the module's vermagic matches the
          # shipped image EXACTLY ("7.0.0-g122c2c22d838"). The config sets
          # CONFIG_LOCALVERSION="-g122c2c22d838" and CONFIG_LOCALVERSION_AUTO=n,
          # which takes git fully out of scripts/setlocalversion. (This kernel's
          # setlocalversion was rewritten and no longer reads .scmversion, so the
          # old .scmversion trick is a no-op — with LOCALVERSION_AUTO=y it would
          # still append "-dirty" because `git apply` leaves the tree modified,
          # producing a vermagic the running kernel rejects with "Invalid module
          # format".) LOCALVERSION= (empty, exported to the recipe env) stops
          # setlocalversion from appending a trailing "+" in the AUTO=n branch.
          export PATH="/usr/lib/ccache:$PATH"
          ccache -z
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache aarch64-linux-gnu-gcc" \
            LOCALVERSION= \
            modules_prepare
          ccache -s

      - name: Build only the panel-sitronix-st7701 module
        run: |
          cd kbuild
          export PATH="/usr/lib/ccache:$PATH"
          # KBUILD_MODPOST_WARN=1 turns modpost's "unresolved symbol" errors
          # into warnings. Without Module.symvers (which a full `make modules`
          # would produce), modpost cannot verify cross-module references.
          # CONFIG_MODVERSIONS is disabled in this kernel config, so the
          # resulting .ko loads fine on the running kernel — modpost is just
          # doing build-time static verification we can safely defer.
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache aarch64-linux-gnu-gcc" \
            KBUILD_MODPOST_WARN=1 \
            LOCALVERSION= \
            M=drivers/gpu/drm/panel
          ls -la drivers/gpu/drm/panel/panel-sitronix-st7701.ko

      - name: Assert module vermagic matches the target kernel
        run: |
          cd kbuild
          KO=drivers/gpu/drm/panel/panel-sitronix-st7701.ko
          VM=$(grep -a -o 'vermagic=[^[:cntrl:]]*' "$KO" | head -1)
          EXPECT="vermagic=${KERNEL_RELEASE} SMP preempt mod_unload aarch64"
          echo "built:    $VM"
          echo "expected: $EXPECT"
          if [ "$VM" != "$EXPECT" ]; then
            echo "::error::vermagic mismatch — this .ko would be rejected on-device with 'Invalid module format'. A '-dirty' suffix or a drifting commit sha is the usual cause."
            exit 1
          fi
          echo "vermagic OK"

      - name: Extract and strip panel module
        run: |
          mkdir -p artifacts
          KO_SRC=kbuild/drivers/gpu/drm/panel/panel-sitronix-st7701.ko
          KO_OUT="artifacts/panel-sitronix-st7701-${KERNEL_RELEASE}.ko"
          aarch64-linux-gnu-strip --strip-debug "$KO_SRC" -o "$KO_OUT"
          ls -la "$KO_OUT"
          (cd artifacts && sha256sum "panel-sitronix-st7701-${KERNEL_RELEASE}.ko" > SHA256SUMS)
          cat artifacts/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panel-module-${{ env.KERNEL_RELEASE }}
          path: artifacts/

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/panel-sitronix-st7701-${{ env.KERNEL_RELEASE }}.ko
            artifacts/SHA256SUMS
            scripts/enable-gigadisplay-shield.sh
            scripts/validate-gigadisplay-shield.sh
            scripts/gigadisplay-shield.dtso
          fail_on_unmatched_files: true
          generate_release_notes: true
