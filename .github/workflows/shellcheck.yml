name: shellcheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on shell scripts
        run: |
          set -e
          shopt -s globstar nullglob
          files=(scripts/**/*.sh tools/**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint."
            exit 0
          fi
          echo "Linting: ${files[*]}"
          shellcheck "${files[@]}"
